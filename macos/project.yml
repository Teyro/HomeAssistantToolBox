# Xcode-Projekt für App + Widgets. Erzeugen: xcodegen generate
name: HAToolBox
options:
  bundleIdPrefix: de.teyro
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  HALogik:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Ohne Apple-Entwicklerkonto: lokal signieren ("Sign to Run Locally")
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: NO
    DEAD_CODE_STRIPPING: YES
targets:
  HAToolBox:
    type: application
    platform: macOS
    sources:
      - path: Sources/HAToolBox
      - path: Sources/Widgets
      - path: ressourcen/AppIcon.icns
        buildPhase: resources
      - path: ressourcen/i18n
        type: folder
        buildPhase: resources
      - path: ressourcen/sprachen
        buildPhase: resources
    dependencies:
      - package: HALogik
      - target: HAToolBoxWidgets
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_NAME: "Home Assistant ToolBox"
        EXECUTABLE_NAME: HAToolBox
        PRODUCT_BUNDLE_IDENTIFIER: de.teyro.homeassistanttoolbox
        INFOPLIST_FILE: ressourcen/Info.plist
        GENERATE_INFOPLIST_FILE: NO
  HAToolBoxWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/WidgetErweiterung
      - path: Sources/Widgets
      - path: ressourcen/i18n
        type: folder
        buildPhase: resources
      - path: ressourcen/sprachen
        buildPhase: resources
    dependencies:
      - package: HALogik
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_NAME: HAToolBoxWidgets
        PRODUCT_BUNDLE_IDENTIFIER: de.teyro.homeassistanttoolbox.widgets
        INFOPLIST_FILE: ressourcen/Widgets-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: ressourcen/Widgets.entitlements
        SKIP_INSTALL: YES
schemes:
  HAToolBox:
    build:
      targets:
        HAToolBox: all
        HAToolBoxWidgets: all
