# Xcode-Projekt für App + Widgets. Erzeugen: xcodegen generate
name: HALeiste
options:
  bundleIdPrefix: de.teyro
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  HALogik:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.1.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Ohne Apple-Entwicklerkonto: lokal signieren ("Sign to Run Locally")
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: NO
    DEAD_CODE_STRIPPING: YES
targets:
  HALeiste:
    type: application
    platform: macOS
    sources:
      - path: Sources/HALeiste
      - path: Sources/Widgets
      - path: ressourcen/AppIcon.icns
        buildPhase: resources
    dependencies:
      - package: HALogik
      - target: HALeisteWidgets
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_NAME: "HA Leiste"
        EXECUTABLE_NAME: HALeiste
        PRODUCT_BUNDLE_IDENTIFIER: de.teyro.haleiste
        INFOPLIST_FILE: ressourcen/Info.plist
        GENERATE_INFOPLIST_FILE: NO
  HALeisteWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/WidgetErweiterung
      - path: Sources/Widgets
    dependencies:
      - package: HALogik
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_NAME: HALeisteWidgets
        PRODUCT_BUNDLE_IDENTIFIER: de.teyro.haleiste.widgets
        INFOPLIST_FILE: ressourcen/Widgets-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: ressourcen/Widgets.entitlements
        SKIP_INSTALL: YES
schemes:
  HALeiste:
    build:
      targets:
        HALeiste: all
        HALeisteWidgets: all
