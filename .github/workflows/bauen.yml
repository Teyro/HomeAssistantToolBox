name: Bauen und testen

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kde:
    name: KDE-Widget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Logik gegen nachgebautes Home Assistant testen
        run: |
          HA_MOCK_LOG="$PWD/mock.log" node test/ha-mock.mjs 8123 > /dev/null 2>&1 &
          sleep 2
          node plasma/test/logik-test.mjs

      - name: Plasmoid packen
        run: |
          mkdir -p build
          (cd plasma/package && zip -qr ../../build/home-assistant.plasmoid metadata.json contents)
          unzip -l build/home-assistant.plasmoid | tail -1

      - uses: actions/upload-artifact@v5
        with:
          name: plasmoid
          path: build/home-assistant.plasmoid

  macos:
    name: Mac-App
    runs-on: macos-26
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v5

      - name: Swift-Version
        run: swift --version

      - name: Logik testen
        run: swift test

      - name: App bauen
        run: |
          VERSION=$(cat VERSION)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF#refs/tags/v}"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ./scripts/baue-app.sh "$VERSION"

      - name: Bildschirmfotos gegen nachgebautes Home Assistant
        timeout-minutes: 6
        run: |
          HA_MOCK_LOG="$PWD/mock.log" node ../test/ha-mock.mjs 8123 > /dev/null 2>&1 &
          HA_MOCK_NAME=Ferienhaus HA_MOCK_TOKEN=ferien-token HA_MOCK_LOG="$PWD/mock2.log" node ../test/ha-mock.mjs 8124 > /dev/null 2>&1 &
          sleep 2
          for m in Dark Light; do
            HA_ADRESSE=http://127.0.0.1:8123 HA_TOKEN=test-token HA_HAUPTZAEHLER=sensor.stromzaehler_leistung \
            HA_ADRESSE2=http://127.0.0.1:8124 HA_TOKEN2=ferien-token \
            HA_BILDER="$PWD/bilder-ci" "build/HA Leiste.app/Contents/MacOS/HALeiste" --vorschau $m || echo "Lauf $m: $?"
          done
          # Falscher Token: Fehleranzeige, und es darf nicht ständig weiter angefragt werden (ip_ban)
          cp mock.log mock.log.vorher
          HA_ADRESSE=http://127.0.0.1:8123 HA_TOKEN=falsch HA_NUR_ERSTES=7_falscher_token HA_BILDER="$PWD/bilder-ci" \
            "build/HA Leiste.app/Contents/MacOS/HALeiste" --vorschau Dark || true
          N=$(( $(wc -l < mock.log) - $(wc -l < mock.log.vorher) ))
          echo "Anfragen mit falschem Token: $N"
          tail -n $N mock.log | cut -c1-120
          test "$N" -le 4
          ls -la bilder-ci

      - name: Widgets beim System angemeldet?
        run: |
          cp -R "build/HA Leiste.app" /Applications/
          open "/Applications/HA Leiste.app" --args --nur-starten || true
          sleep 8
          pluginkit -mAvvv -p com.apple.widgetkit-extension 2>&1 | grep -i -A3 haleiste || echo "WARNUNG: Widget-Erweiterung nicht gefunden"
          pkill -f "HA Leiste.app" || true

      - uses: actions/upload-artifact@v5
        with:
          name: bilder
          path: macos/bilder-ci

      - uses: actions/upload-artifact@v5
        with:
          name: app
          path: macos/build/HA-Leiste-*.zip

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [kde, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dateien
          merge-multiple: true
      - name: Dateien an das Release hängen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dateien
          gh release upload "$GITHUB_REF_NAME" dateien/home-assistant.plasmoid dateien/HA-Leiste-*.zip --clobber -R "$GITHUB_REPOSITORY"
